name: PyServe AI API CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black==26.10.1 flake8==7.4.1 mypy==2.4.0 pytest==9.1.1 pip-audit==2.10.1 httpx2==2.13.1

      - name: Verify Code Formatting (Black)
        run: |
          black --check app tests scripts

      - name: Verify Code Style & Lint (Flake8)
        run: |
          flake8 app tests scripts

      - name: Verify Static Typing (Mypy)
        run: |
          mypy app tests scripts

      - name: Audit Dependencies for Known Vulnerabilities (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Run Test Suite (Pytest)
        env:
          ENVIRONMENT: test
          API_KEY: ci-test-secret-key-12345
        run: |
          pytest -v
