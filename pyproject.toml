[project]
name = "pyserve-ai-api"
version = "0.1.0"
description = "PyServe AI API — Production-ready Sentiment Analysis ML Model Serving Framework"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Himanshu Sekhar Sahoo" },
    { name = "PyServe AI API Contributors" },
    { name = "eightBEC" },
]
dependencies = [
    "fastapi>=0.109.1",
    "uvicorn>=0.25.0",
    "pydantic>=2.5.3",
    "starlette>=0.35.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "joblib==1.6.0",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = [
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "black>=24.3.0",
    "flake8>=6.1.0",
    "bandit>=1.7.6",
    "pytest>=7.4.3",
    "httpx2>=2.0.0",
    "pytest-cov>=4.1.0",
    "pip-audit>=2.7.0",
]

[tool.poetry]
name = "pyserve-ai-api"
version = "0.1.0"
description = "PyServe AI API — Production-ready Sentiment Analysis ML Model Serving Framework"
authors = ["Himanshu Sekhar Sahoo", "PyServe AI API Contributors", "eightBEC <upstream skeleton author>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]


[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.toml
  |\.sh
  |\.yaml
  |\.yml
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinsfile
)/
'''

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.coverage.run]
source = ['app']
branch = true

[tool.coverage.report]
fail_under = 80
precision = 2

[tool.mypy]
python_version = "3.11"

warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
